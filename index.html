<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>convert.in</title>
    <meta
      name="description"
      content="Convert, compress, merge, sign, protect and redact a PDF or an image. Your browser does the work, and there is no server behind it."
    />

    <!--
      What a link to this page turns into when it is pasted somewhere. Without
      these, a share in a chat window is a bare URL, and the one claim worth
      making about this tool is the one that goes unread.

      The URLs here are absolute because the Open Graph protocol requires it:
      a relative og:image is ignored by most of the scrapers that read it. That
      makes this block the one thing in the repository that names a particular
      deployment, and `base` is still './', so a copy hosted anywhere else works
      exactly as before, with a card that points back here. A fork that wants
      its own card changes these five lines; one that wants none deletes them.
    -->
    <link rel="canonical" href="https://convertin.kevinpradith.my.id/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="convert.in" />
    <meta property="og:url" content="https://convertin.kevinpradith.my.id/" />
    <meta property="og:title" content="PDF and image tools that never upload a file" />
    <meta
      property="og:description"
      content="Convert, compress, merge, sign, protect and redact a PDF or an image. Your browser does the work, and there is no server behind it."
    />
    <meta property="og:image" content="https://convertin.kevinpradith.my.id/images/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The convert.in landing page: the headline PDF and image tools that never upload a file, over a photograph of a sky."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The deep blue at the top of the photograph, so a mobile browser's own
         chrome carries the page's colour rather than its default grey. -->
    <meta name="theme-color" content="#0a2a56" />

    <!--
      The stylesheet is what names the fonts, so without this the browser only
      learns about them after it has parsed the CSS, and the first paint is set
      in a fallback that then swaps. This is the face every line on the page is
      set in; the display italic in the headline is one line and can wait.
    -->
    <link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      A rounded dark tile with two rules on it, which reads as a document at the
      size a tab actually draws it. The wordmark was tried here and does not
      survive: 628 by 183 letterforms squeezed into 16 pixels are a smear, and
      the tile they sit on disappears into a dark tab strip, leaving the mark
      floating with nothing under it.

      Inline, so a visit does not spend a request finding out there is none.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231b1b1b'/%3E%3Cpath d='M4.5 6.5h4.5M4.5 9.5h7' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
