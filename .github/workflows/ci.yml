name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a dependency that breaks the build is found before someone else finds it.
  schedule:
    - cron: '0 6 * * 1'

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the token every step inherits. Nothing here writes.
permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, the current LTS, and current.
        node: ['20.19', '22', '24']
    steps:
      # Actions are pinned to a commit, not a tag. A tag is a moving pointer,
      # and moving one is exactly how tj-actions/changed-files was turned into
      # a secret exfiltrator across 23,000 repositories in March 2025
      # (CVE-2025-30066). Dependabot still bumps these; it rewrites the comment
      # with the version it moved to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow token is written into .git/config unless this is set,
          # where anything running later in the job can read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Formatting is checked rather than applied, so a pull request is told
      # what to run instead of having its diff rewritten under it.
      - run: npm run format:check

      - run: npm test

      - run: npm run build

      # The licence notices are read out of the bundle rather than written
      # down, so a dependency added without regenerating them shows up here as
      # a dirty tree rather than as a missing copyright notice in a release.
      - name: The third-party notices match what is bundled
        run: git diff --exit-code -- public/THIRD-PARTY-NOTICES.txt

      # The point of the CLI is that it runs the same core, so a build that
      # passes while the command line is broken has not passed.
      - run: npm run cli -- --version

  privacy:
    name: Nothing leaves the origin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: npm ci

      # Pinned in test/requirements.txt for the same reason the actions are
      # pinned, and kept in a file rather than inline so Dependabot can see it.
      - run: pip install -r test/requirements.txt

      - run: python -m playwright install --with-deps chromium

      - run: npm run build

      # Encrypted files written by this tool, read back with a library that
      # shares no code with the one that wrote them.
      - name: Write the fixtures and audit them independently
        run: |
          npm run audit:fixtures -- ./fixtures
          python3 test/encryption-audit.py ./fixtures

      # Every command, once, with its output read back. Covers the layer
      # between a typed command and src/core that neither other suite touches.
      - run: npm run test:cli

      # Files nobody wrote on purpose. A parser over input it did not produce
      # is the shape of software that fails badly, so this asks how a damaged
      # file is refused rather than whether. Sixty rounds on a push and four
      # hundred on the weekly run: the value is in the rare mutation, and a
      # pull request should not wait for it.
      - name: Damaged files are refused rather than crashed on
        run: >-
          python3 test/fuzz-cli.py ./fixtures
          --rounds ${{ github.event_name == 'schedule' && 400 || 60 }}

      # Serves the real dist/ with the real headers, drives every tool, and
      # fails if a single request leaves the origin or the CSP is violated.
      - run: npm run test:browser
