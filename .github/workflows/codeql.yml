name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run catches a query added to the pack after the last commit, which
  # is how a rule written today finds a bug written last year.
  schedule:
    - cron: '0 7 * * 1'

# Least privilege at the top; the one job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse TypeScript
    # Code scanning is free on public repositories and needs GitHub Advanced
    # Security on private ones. Guarded rather than left to fail, so this waits
    # quietly until the repository is public instead of painting every run red.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      # Uploading the results is the whole point of the run.
      security-events: write
      contents: read
    steps:
      # Pinned to a commit for the reason spelled out in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # The default pack skips rules that trade a little noise for reach.
          # This tool parses files it did not write, so the reach is worth it.
          queries: security-extended

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
