version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A pull request per dependency is noise on a project this size, and the
    # bundle's licence notices have to be regenerated either way.
    groups:
      dependencies:
        patterns: ['*']
    open-pull-requests-limit: 5
    ignore:
      # @types/node is pinned to the oldest Node this supports, so that using an
      # API newer than package.json's engines field is a typecheck error rather
      # than something a person on 24 never sees. Bumping it would quietly lift
      # the floor, so the major is not wanted here.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # The two Python packages the privacy job installs. Pinned in the file rather
  # than inline in the workflow so that this can watch them.
  - package-ecosystem: pip
    directory: /test
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ['*']
